# ログ版ビルドの追加設定。
#
#   ./scripts/local-build.sh log
#
# ログそのものは ZMK 公式の zmk-usb-logging スニペットが受け持つ。あちらが
# CONFIG_ZMK_USB_LOGGING に加えて、USB CDC ACM のデバイスツリーノードと
# zephyr,console の割り当てまで面倒を見てくれる。設定だけ y にしても
# ノードが無ければ USB_CDC_ACM は有効にならず、リンクが通らない。
#
# ここに残っているのは、そのスニペットと噛み合わない設定を外す分だけだ。
#
# 何に使うか
#
#   1. 振動の較正値を読む
#      蓋を開けて電池で起動すると自動較正が走り、
#        Haptic calibrated: comp=<A> bemf=<B> bemf_gain=<C>
#      が出る。この3つを左右それぞれの .conf に書き写して
#      CONFIG_KOBITOKEY_HAPTIC_AUTOCAL=n にすると、毎回の較正待ちが消え、
#      閉じたままUSBを挿したときの一発も本調子で鳴るようになる。
#
#   2. 振動が無反応なときの切り分け
#      Haptic driver setup failed が出ていれば、DRV2605L に届いていない。
#      D18/D19 のピン割り当てを疑う番だ（kobitokey.dtsi のコメント参照）。
#
#   3. 起動原因の確認
#      落ちた理由が RESETREAS からログに出る。
#
# 読み方: USBで挿すとシリアルポートとして見えるので、
#   screen /dev/tty.usbmodem* 115200
# など。ボーレートはCDCなので実際には何でもいい。

# Studioとは同居できない。
#
# studio-rpc-usb-uart スニペットは USB CDC を Studio 専用のRPC経路として
# 使い、コンソールを無効にする。ログは逆にそのコンソールを要求するので、
# 両方を同時には立てられない。ログ版はスニペットを zmk-usb-logging に
# 差し替えてビルドするため、Studio 側の設定もここで落としておく。
#
# 較正値を読むのにStudioは要らないので、失うものは無い。
CONFIG_ZMK_STUDIO=n

# 較正が走るまでの待ちを、ターミナルを開ける長さに延ばす。
#
# 通常は起動の500ms後に自動較正が走ってログを出す。だが USB CDC が
# 認識されてシリアルを開くまでには、それより時間がかかる。つまり通常の
# 待ち時間のままだと、読みたい行は「開く前に流れ終わっている」。
#
# 10秒あれば、挿してからターミナルを開いて待ち構えられる。
# 通常ビルドには入らないので、普段の起動が遅くなることはない。
CONFIG_KOBITOKEY_HAPTIC_BOOT_DELAY_MS=10000

# 共振周期を測るため、ログ版では較正を必ず走らせる。
#
# 左右の .conf は実測値が入って n になっている。EXTRA_CONF_FILE は
# シールドの .conf より後にマージされるので、ここでの y が勝つ。
CONFIG_KOBITOKEY_HAPTIC_AUTOCAL=y

# 較正を5回繰り返して散らばりを見る。
CONFIG_KOBITOKEY_HAPTIC_CAL_SURVEY=5

# ジェスチャーパッドの生の信号(差分カウント)を、読むたびにログへ出す。
CONFIG_KOBITOKEY_GESTUREPAD_DEBUG_DIFF=y
