manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: badjeff
      url-base: https://github.com/badjeff
    - name: efogdev
      url-base: https://github.com/efogdev
    - name: hsgw
      url-base: https://github.com/hsgw
    - name: zettaface
      url-base: https://github.com/zettaface
    - name: caksoylar  # <-- led
      url-base: https://github.com/caksoylar

  projects:
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml

    # PMW3610 ドライバ（外部モジュール）
    - name: zmk-pmw3610-driver
      remote: efogdev
      revision: main
      # path: modules/zmk-pmw3610-driver

    # Sensor-rotation
    - name: zmk-feature-sensor_rotation
      remote: hsgw
      revision: main

    # Arrow-torabo
    - name: zmk-input-processor-keybind
      remote: zettaface
      revision: main

    # LED
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3


  self:
    path: config