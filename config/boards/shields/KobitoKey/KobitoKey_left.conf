CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

CONFIG_SPI=y
CONFIG_INPUT=y

# 刻みの間隔は「転がした距離」で刻む版を試したが、時々気持ち悪いという
# 評価で「転がしの速さ」で詰める版に戻した。右の .conf に経緯あり。
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_MS=55

# 720 と 2880 は右の 60 と 240 の12倍で、右と同じ速さ (16mm/s と
# 64mm/s) を狙って逆算した値。この半身の刻みは、中央側の共有プロセッサ
# ではなく、この半身自身の input callback が鳴らしている。だから見えて
# いるのはセンサーの生のカウントで、右半身が数えているスクロール出力
# ではない。同じ手の動きに対して、この半身の数字は右のおよそ12倍になる。
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_SLOW_MS=100
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_SLOW_SPEED=720
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_FAST_SPEED=2880

# 距離で刻む版の設定。もう一度試したくなったら、上の3行を#で潰して
# 下の3行を有効にすれば戻る(TICK_NOTCHは右と同じ数字でいい。倍率は
# TICK_SCALEが持つ)。
# CONFIG_KOBITOKEY_HAPTIC_TICK_BY_DISTANCE=y
# CONFIG_KOBITOKEY_HAPTIC_TICK_NOTCH=3
# CONFIG_KOBITOKEY_HAPTIC_TICK_SCALE=12

# 26 = Sharp Tick 3 - 60%。
#
# 較正が壊れていた頃は駆動が弱く、21 (Medium Click) のような重い波形で
# ないと伝わらなかった。実測値を入れて本来の強さが出るようになったので、
# 軽い刻みで足りるようになった。
#
# 同じ波形の強度違いが並んでいるので、上下は番号だけで動かせる:
#   24 = Sharp Tick 1 - 100%
#   25 = Sharp Tick 2 -  80%
#   26 = Sharp Tick 3 -  60%
# 一覧は config/DRV2605L_EFFECTS.md
CONFIG_KOBITOKEY_HAPTIC_EFFECT=26

# この個体の実測値。2026-09-02、較正を5回繰り返して採った。
#   bemf: 161 / 166 / 163 / 163 / 163  → 163
#   comp は5回とも 7、gain は5回とも 1
#   共振は 42/41/44/42/42 → 約 241.8 Hz
#
# 5回とも自分の中でまとまっているので、これは測り損ねではなく実測値だ。
# 以前入れていた bemf=143 は、過駆動が足りない状態で1回だけ通った較正の
# 値で、低めに出ていた。
#
# 右手は bemf=184 / gain=2 / 共振 220.8Hz。同じ型番のモーターでも配線と
# 取り付けでここまで変わるので、左右で使い回さないこと。
#
# 測り直し方: -logging 版（CAL_SURVEY=5）を焼いて起動10秒後のログを読む。
CONFIG_KOBITOKEY_HAPTIC_CAL_COMP=7
CONFIG_KOBITOKEY_HAPTIC_CAL_BEMF=184
CONFIG_KOBITOKEY_HAPTIC_CAL_BEMF_GAIN=2
CONFIG_KOBITOKEY_HAPTIC_AUTOCAL=n

# 共振 241.8Hz の半周期 2068us に合わせる。右手は 220.8Hz なので 18。
CONFIG_KOBITOKEY_HAPTIC_DRIVE_TIME=18

CONFIG_ZMK_BATTERY_REPORTING=y

# ── 右手と同じ充電まわりの挙動 ──────────────────────
# USB挿抜の検知と、閉じたときのSystem OFF。配線は右手と同一
# (VBUS=P0.15, FOLD=P0.19)。kobitokey_fold.c はこのピン番号を
# BUILD_ASSERT で検証するので、基板が変わればビルドで気付ける。
CONFIG_KOBITOKEY_VBUS_SENSE=y
CONFIG_KOBITOKEY_VBUS_LOG_BOOT_STATE=y
CONFIG_KOBITOKEY_FOLD_SENSE=y
CONFIG_POWEROFF=y

# バッテリー残量のLED表示。右手と同じ配色・同じ点灯時間にして、
# どちらを充電しても見え方が変わらないようにする。
CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=800
CONFIG_RGBLED_WIDGET_INTERVAL_MS=300
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=1

# ── 溜め込みを浅くする ──────────────────────────────
# Zephyr既定の16だと、左手→右手のsplit送信が一瞬詰まった間に
# 16件分の動きが溜まり、繋がった瞬間にまとめて流れてスクロールが
# 吹っ飛ぶ。ポインタの動きは古くなった時点で価値が無いので、
# 溜め込むより押し返す方がよい。右手側と同じ深さに揃える。
# 一度 8 に増やしたが、4 へ戻した。深くすると溜まった分だけ古い動きを
# 抱えることになり、スクロールの手応えが鈍る。そもそも詰まりを直したのは
# ドライバ側のタイムアウトと専用ワークキューであって、この深さではない。
CONFIG_INPUT_QUEUE_MAX_MSGS=4

# ハングしたら自力でリセットさせる。起動理由はログにも残る。
CONFIG_KOBITOKEY_HEALTH=y

# 起動理由の白点滅は、原因（ドライバの K_FOREVER）が判明して
# 落ちなくなったので消してある。また止まるようなら y に戻すと、
# 白の回数で理由が分かる（1=ウォッチドッグ 2=電源喪失 …）。
CONFIG_KOBITOKEY_HEALTH_BLINK=n

# splitの周辺スレッドのスタックはZMK既定が756B。この手はトラボの
# データを流し続けるので、余裕を持たせる。溢れればフォールトになる。
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_STACK_SIZE=1024

# フォールト時の停止についてはウォッチドッグ任せでよい。停止すれば
# ワークキューが止まって餌やりも止まるので、8秒後にリセットがかかる。
# （Zephyr 3.5 に RESET_ON_FATAL_ERROR というシンボルは無い）

# 蓋を閉じ始めた時点でトラボを止めるのに使う。右手では他が select して
# いて有効だったが、左手は折りたたみ側のコードが tb_right 決め打ちの
# ガードで丸ごと消えていたため、今まで必要になっていなかった。
CONFIG_PM_DEVICE=y

# 2026-09-03: 左手の振動が明らかに弱いので、右手の値に揃えて切り分ける。
#
# 上書きした3つと、左手で実測した本来の値:
#
#   CAL_BEMF         163 -> 184   ← 左手の実測値は 163
#   CAL_BEMF_GAIN      1 -> 2     ← 左手の実測値は 1
#   DRIVE_TIME        16 -> 18    ← 左手の共振 241.8Hz なら 16 が正しい
#
# どれも左手のモーターを測って出した値なので、右手の数字を入れるのは
# 「意図的に違う個体の測定値を使う」ことになる。差が残るかどうかを見る
# ための一時的な措置であって、正しい設定ではない。
#
# 当時はここに4つめとして COOLDOWN_MS の 100 -> 80 も並んでいて、密度が
# 25%違えば弱く感じるという理屈から、それが本命だと見ていた。その後
# 刻みの間隔は速さで動くようになり、固定値そのものが無くなった。上の
# COOLDOWN の並びが今の設定で、左右で同じ時間を使っている。だから
# 「弱さ」の話としてはもう残っていない。
#
# 切り分けの読み方:
#   揃えて差が消えた   -> 原因は設定。どれが効いたかを1つずつ戻して特定する
#   揃えても左が弱い   -> 原因はハード側（取り付け・モーター個体・ボールの重さ）
#                        設定では埋まらないので、左だけ強いエフェクトにする等
#
# 元に戻すときは上の「左手の実測値」を書き戻すこと。
