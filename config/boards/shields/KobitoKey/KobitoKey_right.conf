CONFIG_ZMK_KEYBOARD_NAME="KobitoKey"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=800
CONFIG_RGBLED_WIDGET_INTERVAL_MS=300

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_KOBITOKEY_HAPTIC_PULSE_MS=7
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_MS=80

CONFIG_KOBITOKEY_VBUS_SENSE=y
CONFIG_KOBITOKEY_VBUS_LOG_BOOT_STATE=y
CONFIG_KOBITOKEY_FOLD_SENSE=y
CONFIG_POWEROFF=y

# Connection interval preference is deliberately NOT overridden here, so
# Zephyr's own defaults apply (MIN_INT=24 / MAX_INT=40, i.e. 30-50ms).
# The PMW3610-based build, whose cursor feel is the target, likewise never
# overrides these. Previously this requested 7.5ms (MIN/MAX_INT=6); a
# haptic-pulse diagnostic measured macOS actually negotiating 10-20ms
# anyway, and every attempt to chase a fast cadence made the cursor feel
# worse, so this tests whether a slower-but-steadier negotiated interval
# reads as smoother than a fast one macOS keeps renegotiating.
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0

# Absorb an occasional missed BLE connection event (radio interference,
# etc.) without coalescing/dropping a report, while still not retaining a
# long tail of stale pointer deltas if the link stalls for longer.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=3

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=1
