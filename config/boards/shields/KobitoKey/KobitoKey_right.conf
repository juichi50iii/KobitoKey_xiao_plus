CONFIG_ZMK_KEYBOARD_NAME="KobitoKey"

CONFIG_ZMK_POINTING=y
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_MOUSE=y

# Restored after being dropped in the strip-everything pass. It was removed
# only because the PMW3610 build does not set it, but it turned out to be
# unrelated to the cursor problem being chased: it adds the HID resolution
# multiplier feature, which affects scroll granularity and never touches
# X/Y motion reports.
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_SPI=y
CONFIG_INPUT=y

CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

CONFIG_RGBLED_WIDGET=y
CONFIG_RGBLED_WIDGET_BATTERY_BLINK_MS=800
CONFIG_RGBLED_WIDGET_INTERVAL_MS=300

CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

CONFIG_KOBITOKEY_HAPTIC_PULSE_MS=7
CONFIG_KOBITOKEY_HAPTIC_COOLDOWN_MS=80

CONFIG_KOBITOKEY_VBUS_SENSE=y
CONFIG_KOBITOKEY_VBUS_LOG_BOOT_STATE=y
CONFIG_KOBITOKEY_FOLD_SENSE=y
CONFIG_POWEROFF=y

# Ask for a fast connection interval again, as a range (7.5ms - 15ms in
# 1.25ms units) rather than the single fixed 7.5ms tried earlier, so the
# host can settle on something it can actually sustain.
#
# Zephyr's defaults (30-50ms) are what the PMW3610 build uses, and they
# were fine while this driver sampled at 15ms. Now that it samples at 8ms,
# reports are produced faster than a 30-50ms transport can drain them, so
# they queue up and the added wait reads as a heavy, laggy cursor even
# though motion itself is smooth. Speeding up the transport is the fix;
# slowing the sensor back down would just undo the smoothness gain.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# Keep the mouse report backlog short. ZMK's default is 20, which at 8ms
# sampling against a ~15ms transport fills completely and leaves every new
# report waiting behind up to 20 older ones -- on the order of 300ms of
# buffered staleness, felt as a heavy, lagging cursor. Pointer motion is
# only useful while it is current, so a shallow queue that applies
# backpressure beats a deep one that hoards stale deltas.
CONFIG_ZMK_BLE_MOUSE_REPORT_QUEUE_SIZE=2

# Same reasoning one stage earlier: Zephyr's input subsystem queues events
# ahead of ZMK's queue, and its default of 16 messages is 8 whole samples
# deep here because each sample emits REL_X and REL_Y separately. 4 keeps
# it to two samples, matching the shallow queue behind it, so a stall
# shows up as backpressure on the sensor rather than a stash of motion
# that is already out of date by the time it is sent.
CONFIG_INPUT_QUEUE_MAX_MSGS=4

CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y
CONFIG_RGBLED_WIDGET_LAYER_0_COLOR=0
CONFIG_RGBLED_WIDGET_LAYER_1_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_2_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_3_COLOR=6
CONFIG_RGBLED_WIDGET_LAYER_4_COLOR=4
CONFIG_RGBLED_WIDGET_LAYER_5_COLOR=1

# ── splitリンクの遅延 ────────────────────────────────
# ZMK既定の LATENCY=30 は「周辺側は最大30回まで応答を省いてよい」と
# いう省電力設定。たまにしか送らないキー入力には向くが、10ms周期で
# 出し続けるトラックボールには重すぎて、7.5ms×31＝最悪232msの沈黙の
# あいだに20件以上が溜まり、繋がった瞬間にまとめて流れて吹っ飛ぶ。
#
# ただし 0 まで落とすと今度は毎回の接続イベントで応答する義務が生じ、
# 取りこぼしを吸収する余地が消えて左手が切断されやすくなった。
# 2 なら溜まるのは2件程度で吹っ飛びには届かず、それでいて猶予が残る。
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=2
CONFIG_ZMK_SPLIT_BLE_PREF_INT=6

# 既定と同値だが、latencyと一緒に読む値なので明示しておく。
# BLE仕様の下限 (1+latency)×interval×2 = 45ms に対して十分な余裕がある。
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400
